:root{

    --accent:#0A84FF; --focus:#0A84FF;
    --bad:#FF453A; --bad-soft:#3A1E1C; --warn:#FF9F0A; --warn-soft:#3D2E12; --good:#30D158; --good-soft:#17301F; --na:#8E8E93; --na-soft:#242424;

/* Navigation: Desktop/Tablet = Segmented-Control-Picker */
nav.tabs{display:flex;gap:2px;overflow-x:visible;background:var(--panel-2);padding:4px;border-radius:12px;margin:0 0 20px;border:0;box-shadow:none;position:sticky;top:8px}

nav.tabs button .tabicon{position:relative;display:inline-flex;width:18px;height:18px;flex:none}

nav.tabs button .tabicon .cnt{position:absolute;top:-6px;right:-8px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--bad);color:#fff;font:700 10px var(--body);display:flex;align-items:center;justify-content:center;line-height:1;margin:0}
nav.tabs button .tabicon .cnt:empty{display:none}

  .btn.ghost{padding:8px 4px;font-size:.9rem}
  .seg button{padding:10px 14px;font-size:.92rem}
}

<script>
/* ---------- Speicher (IndexedDB) und CSV ---------- */
const COLS = ['id','fahrzeug','datum','datum_abgeleitet','km','typ','status','prio','bereich','titel','betrag','kostenart','zweck','zweck_status','betrag_geplant','auf_lager','lagerort','box','fach','bestellt_am','notiz','eltern_id','quelle','kategorie','unterkategorie','kat_status','platz'];
const S_COLS = ['fahrzeug','gruppe','aufgabe','km','datum','status','km_geschaetzt','notiz'];
const P_COLS = ['fahrzeug','gruppe','aufgabe','intervall_km','intervall_jahre','anmerkung','notiz'];
const BLANK = Object.fromEntries(COLS.map(c => [c, '']));

function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], f = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else if(c === '"') q = true;
    else if(c === ','){ row.push(f); f = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && text[i+1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += c;
  }
  if(f !== '' || row.length){ row.push(f); rows.push(row); }
  const header = (rows.shift() || []).map(h => h.trim());
  const out = rows.filter(r => r.length > 1 || (r[0] || '') !== '').map(r => { const o = {}; header.forEach((h, j) => { o[h] = r[j] === undefined ? '' : r[j]; }); return o; });
  return {header, rows: out};
}
function csvField(v){
  const s = v == null ? '' : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(cols, rows, eol){
  eol = eol || '\n';
  return [cols.join(',')].concat(rows.map(r => cols.map(c => csvField(r[c])).join(','))).join(eol) + eol;
}

const Store = (() => {
  let db = null, ok = false; const mem = {};
  const open = () => new Promise(res => {
    try{
      const r = indexedDB.open('zuendfunke', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { db = r.result; ok = true; res(); };
      r.onerror = () => res();
      r.onblocked = () => res();
    }catch(e){ res(); }
  });
  const get = k => new Promise(res => {
    if(!db) return res(mem[k]);
    try{ const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }
    catch(e){ res(mem[k]); }
  });
  const set = (k, v) => new Promise(res => {
    mem[k] = v; if(!db) return res(false);
    try{ const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); t.onabort = () => res(false); }
    catch(e){ res(false); }
  });
  return {open, get, set, get ok(){ return ok; }};
})();

</script>

const todayIso = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const RAW = {meta:{stand:todayIso()}, e:(await Store.get('e'))||[], s:(await Store.get('s'))||[], p:(await Store.get('p'))||[]};
let WISSEN = (await Store.get('wissen'))||{};

// ---------- km-Verlauf & Fälligkeiten ----------
function kmPoints(car){
  const pts = [];
  E.forEach(x => { if(x.fahrzeug===car && x.km && x.datum && !x.datum_abgeleitet) pts.push([day(x.datum).getTime(), x.km]); });
  RAW.s.forEach(x => { if(x.fahrzeug===car && x.km && x.datum && !x.km_geschaetzt) pts.push([day(x.datum).getTime(), +x.km]); });
  pts.sort((a,b)=>a[0]-b[0]);
  const clean = []; pts.forEach(p => { if(!clean.length || p[1] >= clean[clean.length-1][1]) clean.push(p); });
  return clean.length ? clean : [[TODAY.getTime(), 0]];
}
const KM = {}, RATE = {}, CUR = {};
function calcKm(){
for(const car of ['T4','TT']){
  const p = kmPoints(car); KM[car] = p;
  const last = p[p.length-1]; CUR[car] = {km:last[1], date:new Date(last[0])};
  const ref = p.filter(q => q[0] <= last[0] - 3*365*864e5).pop() || p[0];
  RATE[car] = Math.max(1, (last[1]-ref[1]) / Math.max(1,(last[0]-ref[0])/864e5)); // km pro Tag
}
}
calcKm();
function kmAt(car, t){
  const p = KM[car]; if(!p.length) return null;
  if(t <= p[0][0]) return p[0][1];
  for(let i=1;i<p.length;i++) if(t <= p[i][0]){ const [t0,k0]=p[i-1],[t1,k1]=p[i]; return k0 + (k1-k0)*(t-t0)/Math.max(1,t1-t0); }
  return p[p.length-1][1] + RATE[car]*(t-p[p.length-1][0])/864e5;
}
const RULES = {
  'Motoröl und Ölfilter wechseln': [/(ölwechsel|öl\s*[–-]\s*und\s*filterwechsel|öl- und filterwechsel|motoröl[^,]*(wechsel|erneuer))/i, /getriebe|spülung bestellt/i],
  'Nockenwellenantrieb': [/zahnriemen/i, /prüf/i, /(wechsel|service|gewechselt|erneuer)/i],
  'Bremsflüssigkeitswechseln': [/bremsflüssigkeit/i, /stand|prüf/i, /(wechsel|erneuer|ersetz)/i],
  'Luftfilter wechseln': [/luftfilter/i, /bestell/i, /(wechsel|gewechselt|erneuer)/i],
  'Staub- und Pollenfilter wechseln': [/(pollen|innenraum)/i, /bestell/i, /(wechsel|gewechselt|erneuer)/i],
  'Kraftstofffilter ersetzen': [/(kraftstofffilter|dieselfilter)/i, /entwässer/i, /(wechsel|gewechselt|ersetz|erneuer)/i],
  'Getriebe- & Winkelgetriebe Öl wechseln': [/getriebeöl/i, /reiniger/i, /(wechsel|erneuer)/i],
};
RULES['Luftfiltergehäuse reinigen'] = RULES['Luftfilter wechseln'];
RULES['Motoren mit autom. Spannvorrichtung'] = RULES['Nockenwellenantrieb'];
function lastDone(car, task){
  const c = [];
  RAW.s.forEach(s => { if(s.fahrzeug===car && s.aufgabe===task && s.status==='erledigt' && s.km) c.push({km:+s.km, datum:s.datum || null, src:'Service-Nachweis' + (s.km_geschaetzt?' (km geplant)':'')}); });
  const r = RULES[task];
  if(r) E.forEach(x => {
    if(x.fahrzeug!==car || x.status!=='erledigt' || !['ausgabe','arbeit'].includes(x.typ)) return;
    const t = x.titel; if(!r[0].test(t) || (r[1] && r[1].test(t)) || (r[2] && !r[2].test(t))) return;
    const km = x.km || (x.datum ? kmAt(car, day(x.datum).getTime()) : null);
    if(km) c.push({km, datum:x.datum || null, src:x.titel, est:!x.km});
  });
  c.sort((a,b)=>b.km-a.km); return c[0] || null;
}
function dueList(car){
  const out = [];
  RAW.p.filter(p => p.fahrzeug===car && (p.intervall_km || p.intervall_jahre)).forEach(p => {
    const task = p.aufgabe.trim(); const last = lastDone(car, task);
    const ikm = p.intervall_km ? +p.intervall_km : null, ij = p.intervall_jahre ? +p.intervall_jahre : null;
    let dueKm=null, rest=null, estDate=null, dueDate=null;
    if(last && ikm){ dueKm = last.km + ikm; rest = dueKm - CUR[car].km; estDate = addDays(TODAY, rest / RATE[car]); }
    if(last && ij && last.datum){ dueDate = new Date(day(last.datum)); dueDate.setFullYear(dueDate.getFullYear()+ij); }
    const cand = [estDate, dueDate].filter(Boolean).sort((a,b)=>a-b)[0] || null;
    let st = 'na';
    if(last){
      const daysLeft = cand ? (cand - TODAY)/864e5 : 9999;
      st = (rest!=null && rest<0) || daysLeft < 0 ? 'bad' : ((rest!=null && rest < 2500) || daysLeft < 90 ? 'warn' : 'good');
    }
    out.push({car, key: !!RULES[task], task: task.replace('Motoren mit autom. Spannvorrichtung','Zahnriemen prüfen (Spannung/Zustand)').replace('Nockenwellenantrieb','Zahnriemen-Wechsel (Nockenwellenantrieb)').replace('Bremsflüssigkeitswechseln','Bremsflüssigkeit wechseln'), gruppe:p.gruppe, ikm, ij, last, dueKm, rest, dueDate, when:cand, st});
  });
  const ord = {bad:0, warn:1, good:2, na:3};
  return out.sort((a,b)=> ord[a.st]-ord[b.st] || (a.when||Infinity)-(b.when||Infinity));
}
const DUE = {};
function calcDue(){ DUE.T4 = dueList('T4'); DUE.TT = dueList('TT'); }
calcDue();
const whenTxt = d => !d.when ? '' : (d.when < TODAY ? 'seit ca. ' : 'ca. ') + d.when.toLocaleDateString('de-DE',{month:'short',year:'numeric'});
const PILL = {bad:'überfällig', warn:'bald fällig', good:'im Plan', na:'keine Daten'};
const pill = st => `<span class="pill ${st}">${PILL[st]}</span>`;
let VEH = 'alle';
try{ const v = localStorage.getItem('gb-veh'); if(v==='T4'||v==='TT'||v==='alle') VEH = v; }catch(e){}
const inV = x => VEH==='alle' || x.fahrzeug===VEH;
const inVL = x => VEH==='alle' || x.fahrzeug===VEH || x.fahrzeug==='WERKSTATT';
const carsV = () => VEH==='alle' ? ['T4','TT'] : [VEH];
const termine = () => E.filter(x => inV(x) && x.typ==='termin' && x.status==='offen' && !pendingStatus[x.id]).sort((a,b)=>a.datum.localeCompare(b.datum));

// ---------- Kosten ----------
const isCost = x => x.typ==='ausgabe' && x.betrag!=null && x.kostenart!=='Fahrzeugkauf' && x.zweck!=='Kauf';
const isTech = x => isCost(x) && zweckOf(x)==='Wartung/Reparatur';
function costBy(car){
  const y = {};
  E.forEach(x => { if(!isCost(x) || (car!=='alle' && x.fahrzeug!==car) || !x.datum) return;
    const yr = x.datum.slice(0,4); const k = ZW.includes(zweckOf(x)) ? zweckOf(x) : 'Wartung/Reparatur';
    y[yr] = y[yr] || Object.fromEntries(ZW.map(z=>[z,0])); y[yr][k] += x.betrag; });
  return y;
}
const sum = (arr, f) => arr.reduce((a,x)=>a+(f(x)||0),0);
function carStats(car){
  const costs = E.filter(x => x.fahrzeug===car && isCost(x));
  const kauf = E.find(x => x.fahrzeug===car && x.kostenart==='Fahrzeugkauf');
  const total = sum(costs, x=>x.betrag);
  const tech = sum(costs.filter(isTech), x=>x.betrag);
  const byZ = Object.fromEntries(ZW.map(z=>[z, sum(costs.filter(x=>zweckOf(x)===z), x=>x.betrag)]));
  const first = KM[car][0];
  const driven = CUR[car].km - first[1];
  const todos = E.filter(x => x.fahrzeug===car && ['todo','bestellung'].includes(x.typ) && ['offen','bestellt','zu bestellen'].includes(x.status) && !pendingStatus[x.id]);
  const plan = sum(todos, x => x.betrag_geplant ?? x.betrag);
  const yr = String(TODAY.getFullYear());
  const thisYear = sum(costs.filter(x => isTech(x) && (x.datum||'').startsWith(yr)), x=>x.betrag);
  const review = costs.filter(needsReview).length;
  return {total, tech, byZ, review, kauf: kauf ? kauf.betrag : 0, per1000: driven>0 ? tech/driven*1000 : null, driven, since: new Date(first[0]), todos: todos.length, plan, thisYear};
}

// ---------- Render: Überblick ----------
function odo(km){
  const s = String(Math.round(km)).padStart(6,'0');
  return `<div class="odo" aria-label="${kmf(km)}">${[...s].map((c,i)=>`<span class="${i===s.length-1?'last':''}">${c}</span>`).join('')}</div>`;
}
function renderOverview(){

  const cards = carsV().map(car => {

        <div class="stat"><div class="v">${eur(st.thisYear)}</div><div class="l">Technik in ${TODAY.getFullYear()}</div></div>

      </div>
      <div class="small muted">Gesamtkosten des Fahrzeugs (ohne Kaufpreis ${eur(st.kauf)}): <b class="num" style="color:var(--ink)">${eur(st.total)}</b>${st.review?` · <a href="#" data-goto="kosten">${st.review} Zuordnungen prüfen</a>`:''}</div>
      <div class="zbar" role="img" aria-label="Gesamtkosten nach Zweck">${ZW.filter(z=>st.byZ[z]>0).map(z=>`<i style="width:${st.byZ[z]/st.total*100}%;background:var(${ZW_VAR[z]})" title="${ZW_LABEL[z]}: ${eur(st.byZ[z])}"></i>`).join('')}</div>
      <div class="zleg" style="margin-bottom:14px">${ZW.filter(z=>st.byZ[z]>0).map(z=>`<span><i style="background:var(${ZW_VAR[z]})"></i>${ZW_SHORT[z]} <span class="num">${eur(st.byZ[z])}</span></span>`).join('')}</div>
      <h3>Nächste Wartung</h3>
      <div class="due">${due.map(d => `<div class="dueline">${pill(d.st)}<div>${esc(d.task)}<div class="small muted">${d.dueKm?`fällig bei ${kmf(d.dueKm)} · `:''}${whenTxt(d)}</div></div><div class="num small">${d.rest!=null?(d.rest<0?'−':'')+kmf(Math.abs(d.rest)).replace(' km','')+' km':''}</div></div>`).join('') || '<div class="muted small">Keine Intervalldaten.</div>'}</div>
    </article>`; }).join('');
  const recent = E.filter(x => inV(x) && ['ausgabe','arbeit'].includes(x.typ) && x.datum && x.datum <= iso(TODAY) && !x.eltern_id).sort((a,b)=>b.datum.localeCompare(a.datum)).slice(0,8);
  $('#ueberblick').innerHTML = alerts + `<div class="${VEH==='alle'?'grid2':''}">${cards}</div>
    <div class="panel" style="margin-top:16px"><h2>Zuletzt in der Garage</h2><div class="list">${recent.map(x=>itemHtml(x,false,false,true)).join('')}</div></div>`;
}

// ---------- Render: Anstehend ----------
function renderDue(){
  const rows = carsV().flatMap(c => DUE[c]).filter(d=>d.st!=='na').sort((a,b)=>({bad:0,warn:1,good:2}[a.st]-{bad:0,warn:1,good:2}[b.st]) || (a.when||Infinity)-(b.when||Infinity));
  const nodata = carsV().flatMap(c => DUE[c]).filter(d=>d.st==='na');
  const open = E.filter(x => inV(x) && ['todo','bestellung'].includes(x.typ) && ['offen','bestellt','zu bestellen'].includes(x.status) && !x.eltern_id);
  const kids = id => E.filter(x => x.eltern_id===id);
  const groups = {};
  open.forEach(x => { const k = x.fahrzeug; (groups[k] = groups[k] || []).push(x); });
  const prioSort = (a,b) => (+(a.prio||9))-(+(b.prio||9)) || (a.typ===b.typ?0:(a.typ==='todo'?-1:1));
  $('#anstehend').innerHTML = `
    <div class="panel"><h2>Wartung nach Intervall</h2>
      <p class="small muted" style="margin-top:0">Berechnet aus Service-Nachweis, Journal und Intervallen. Die Datumsschätzung nutzt deine durchschnittliche Fahrleistung.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Status</th><th>Fzg.</th><th>Aufgabe</th><th>Intervall</th><th class="r">zuletzt</th><th class="r">fällig</th><th class="r">Rest</th><th>ca.</th></tr></thead><tbody>
      ${rows.map(d => `<tr><td>${pill(d.st)}</td><td><span class="tag ${d.car}">${d.car}</span></td><td>${esc(d.task)}<div class="small muted">${esc(d.last?.src?.slice(0,70) || '')}${d.last?.est?' · km aus Datum geschätzt':''}</div></td>
      <td class="small">${d.ikm?`${(d.ikm/1000).toLocaleString('de-DE')} Tsd. km`:''}${d.ikm&&d.ij?' / ':''}${d.ij?`${d.ij} J.`:''}</td>
      <td class="r num small">${d.last?kmf(d.last.km):''}${d.last?.datum?`<br>${dstr(d.last.datum)}`:''}</td>
      <td class="r num small">${d.dueKm?kmf(d.dueKm):''}${d.dueDate?`<br>${d.dueDate.toLocaleDateString('de-DE')}`:''}</td>
      <td class="r num small">${d.rest!=null?(d.rest<0?'−':'')+Math.abs(Math.round(d.rest)).toLocaleString('de-DE'):''}</td>
      <td class="small">${whenTxt(d)}</td></tr>`).join('')}
      </tbody></table></div>
      ${nodata.length?`<details style="margin-top:8px"><summary>${nodata.length} Intervalle ohne Nachweis</summary><div class="note">${nodata.map(d=>`${d.car}: ${d.task}`).join('\n')}</div></details>`:''}
    </div>
    ${['T4','TT','WERKSTATT'].filter(c=>groups[c]).map(c => `
    <div class="panel" style="margin-top:16px"><h2><span class="tag ${c}">${c}</span> Offene Aufgaben &amp; Bestellungen</h2>
      <div class="list">${groups[c].sort(prioSort).map(x => itemHtml(x, true) + kids(x.id).map(k=>itemHtml(k,true,true)).join('')).join('')}</div>
    </div>`).join('')}`;
  $('#cnt-an').textContent = rows.filter(d=>d.st==='bad'||d.st==='warn').length + termine().length || '';
}

const TYP = {ausgabe:'Ausgabe', arbeit:'Arbeit', todo:'To-do', bestellung:'Bestellung', lager:'Lager', termin:'Termin'};
function itemHtml(x0, actions=false, child=false, edit=false){
  const x = pendingEdit[x0.id] ? {...x0, ...pendingEdit[x0.id]} : x0;
  const ps = pendingStatus[x.id];
  const loc = [x.lagerort, x.box, x.fach].filter(Boolean).join(' · ');
  const meta = [
    `<span class="tag ${x.fahrzeug}">${x.fahrzeug}</span>`,
    `<span>${TYP[x.typ]||x.typ}${x.status && !['erledigt'].includes(x.status)?' · '+esc(x.status):''}</span>`,
    x.prio?`<span>Prio ${esc(x.prio)}</span>`:'',
    x.km?`<span class="mono">${kmf(x.km)}</span>`:'',
    x.bereich?`<span>${esc(x.bereich)}</span>`:'',
    (x.typ==='ausgabe' && x.betrag!=null && x.zweck && x.zweck!=='Kauf')?`<span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(${ZW_VAR[zweckOf(x)]||'--ink-3'});margin-right:4px"></i>${ZW_SHORT[zweckOf(x)]||esc(zweckOf(x))}${x.zweck_status==='prüfen'&&!pendingZweck[x.id]?' (Vorschlag)':''}</span>`:'',
    loc?`<span>Ort: ${esc(loc)}</span>`:'',
    ps?`<span class="pill warn">${esc(ps)} · wartet auf Abgleich</span>`:'',
    pendingEdit[x0.id]?`<span class="pill warn">geändert · wartet auf Abgleich</span>`:''
  ].filter(Boolean).join('');
  const amount = x.betrag!=null ? eur(x.betrag,2) : (x.betrag_geplant!=null ? `<span class="muted">geplant ${eur(x.betrag_geplant,2)}</span>` : '');
  const btn = actions && !ps && ['todo','bestellung'].includes(x.typ) && DB ? `<button class="btn ghost" data-done="${x.id}">erledigt</button>` : '';
  const ebtn = edit && DB ? `<button class="btn ghost" data-edit="${x.id}" aria-label="Eintrag bearbeiten">Bearbeiten</button>` : '';
  return `<div class="item ${child?'child':''}"><div class="d">${x.datum?dstr(x.datum):''}${x.datum_abgeleitet?'<span title="Datum aus Zeile darüber übernommen">*</span>':''}</div>
    <div class="t">${esc(x.titel)}<div class="meta">${meta}</div></div><div class="b">${amount} ${btn} ${ebtn}</div>
    ${x.notiz?`<details><summary>Notiz</summary><div class="note">${esc(x.notiz)}</div></details>`:''}</div>`;
}

// ---------- Kosten-Ansicht ----------
let costCar = 'alle', costView = 'chart', rvAll = false;
function renderCosts(){
  costCar = VEH;
  const y = costBy(costCar); const years = Object.keys(y).sort();
  const totals = years.map(k => ZW.reduce((a,c)=>a+y[k][c],0));
  const maxV = Math.max(...totals, 1);
  const step = maxV > 8000 ? 2000 : maxV > 4000 ? 1000 : 500;
  const top = Math.ceil(maxV/step)*step;
  const W = 760, H = 300, L = 54, R = 8, T = 12, B = 28, bw = (W-L-R)/Math.max(1,years.length);
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kosten pro Jahr nach Zweck">`;
  for(let v=0; v<=top; v+=step){ const yy = T + (H-T-B)*(1-v/top);
    svg += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',Arial,sans-serif">${v.toLocaleString('de-DE')}</text>`; }
  years.forEach((yr,i) => {
    let acc = 0; const x = L + i*bw + bw*0.18, w = bw*0.64;
    ZW.forEach((k,j) => { const v = y[yr][k]; if(v<=0) return;
      const h = (H-T-B)*v/top, yy = T + (H-T-B)*(1-(acc+v)/top);
      const isTop = ZW.slice(j+1).every(q => y[yr][q] <= 0);
      svg += `<rect x="${x}" y="${yy}" width="${w}" height="${Math.max(0,h-2)}" rx="${isTop?3:0}" fill="var(${ZW_VAR[k]})"/>`; acc += v; });
    svg += `<rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" data-yr="${yr}"/>`;
    svg += `<text x="${x+w/2}" y="${H-9}" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',Arial,sans-serif">${yr}</text>`;
  });
  svg += `<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--ink-3)" stroke-width="1"/></svg>`;
  const all = E.filter(x => isCost(x) && (costCar==='alle' || x.fahrzeug===costCar));
  const byZ = ZW.map(k => [k, sum(all.filter(x=>zweckOf(x)===k), x=>x.betrag)]);
  const grand = sum(all, x=>x.betrag), tech = sum(all.filter(isTech), x=>x.betrag);
  const biggest = [...all].filter(isTech).sort((a,b)=>b.betrag-a.betrag).slice(0,10);
  const kauf = E.filter(x => x.kostenart==='Fahrzeugkauf' && (costCar==='alle'||x.fahrzeug===costCar));
  const review = all.filter(needsReview).sort((a,b)=>b.betrag-a.betrag);
  const shownRv = rvAll ? review : review.slice(0,15);
  const table = `<div class="tbl-wrap"><table><thead><tr><th>Jahr</th>${ZW.map(k=>`<th class="r">${ZW_SHORT[k]}</th>`).join('')}<th class="r">Summe</th></tr></thead><tbody>${years.map((yr,i)=>`<tr><td class="num">${yr}</td>${ZW.map(k=>`<td class="r num">${eur(y[yr][k])}</td>`).join('')}<td class="r num"><b>${eur(totals[i])}</b></td></tr>`).join('')}</tbody></table></div>`;
  const opts = cur => ZW.map(z=>`<option value="${z}" ${z===cur?'selected':''}>${ZW_SHORT[z]}</option>`).join('');
  $('#kosten').innerHTML = `
    <div class="filters">
    <div class="seg" role="group" aria-label="Ansicht"><button data-view="chart" aria-pressed="${costView==='chart'}">Diagramm</button><button data-view="table" aria-pressed="${costView==='table'}">Tabelle</button></div></div>
    <div class="kpis">
      <div class="panel stat"><div class="v">${eur(tech)}</div><div class="l">Unterhalt (Technik)</div></div>
      <div class="panel stat"><div class="v">${eur(grand)}</div><div class="l">Gesamtkosten ohne Kaufpreis</div></div>
      <div class="panel stat"><div class="v">${eur(sum(kauf,x=>x.betrag))}</div><div class="l">Kaufpreis${kauf.length>1?'e':''}</div></div>
      <div class="panel stat"><div class="v">${eur(grand + sum(kauf,x=>x.betrag))}</div><div class="l">investiert inkl. Kauf</div></div>
    </div>
    ${review.length ? `<div class="panel" style="margin-bottom:16px"><h2>Zuordnung prüfen <span class="small muted">${review.length} Buchungen · ${eur(sum(review,x=>x.betrag))}</span></h2>
      <p class="small muted" style="margin-top:0">Vorschlag steht im Auswahlfeld. Passt er, einfach „bestätigen“. Deine Wahl wird sofort gespeichert.${DB?'':' <b>Speichern ist in dieser Ansicht nicht verfügbar.</b>'}</p>
      <div>${shownRv.map(x=>`<div class="rv"><div class="d small mono muted">${dstr(x.datum)}</div><div>${esc(x.titel)}<div class="small muted"><span class="tag ${x.fahrzeug}">${x.fahrzeug}</span>${x.eltern_id&&byId[x.eltern_id]?` · zu: ${esc(byId[x.eltern_id].titel.slice(0,50))}`:''}</div></div><div class="num">${eur(x.betrag,2)}</div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><select aria-label="Zweck" data-zsel="${x.id}">${opts(x.zweck)}</select><button class="btn ghost" data-zok="${x.id}" ${DB?'':'disabled'}>bestätigen</button></div></div>`).join('')}</div>
      ${review.length>15?`<div class="empty" style="padding:10px"><button class="btn ghost" data-rvall="1">${rvAll?'weniger anzeigen':`alle ${review.length} anzeigen`}</button></div>`:''}
    </div>` : ''}
    <div class="panel"><h2>Kosten pro Jahr nach Zweck</h2>
      <div class="legend">${ZW.map(k=>`<span><i style="background:var(${ZW_VAR[k]})"></i>${ZW_LABEL[k]}</span>`).join('')}</div>
      <div ${costView==='chart'?'':'hidden'} id="chartbox">${svg}</div><div ${costView==='table'?'':'hidden'}>${table}</div>
    </div>
    <div class="grid2" style="margin-top:16px">
      <div class="panel"><h2>Nach Zweck</h2><div class="bars">${byZ.map(([k,v])=>`<div class="hbar"><div>${ZW_LABEL[k]}<div class="track"><div class="fill" style="width:${grand?v/grand*100:0}%;background:var(${ZW_VAR[k]})"></div></div></div><div class="num r">${eur(v)}</div></div>`).join('')}</div>
        <p class="small muted">Technik = Wartung, Reparatur, Verschleiß. Die Kennzahl „je 1.000 km“ rechnet nur mit Technik.</p></div>
      <div class="panel"><h2>Größte Technik-Posten</h2><div class="list">${biggest.map(x=>itemHtml(x)).join('')}</div></div>
    </div>`;
  const tip = $('#tip');
  $('#chartbox svg')?.addEventListener('mousemove', ev => { const r = ev.target.closest('[data-yr]'); if(!r){tip.hidden=true;return;}
    const yr = r.dataset.yr; tip.innerHTML = `<b>${yr}</b><br>${ZW.filter(k=>y[yr][k]>0).map(k=>`${ZW_SHORT[k]}: <span class="num">${eur(y[yr][k])}</span>`).join('<br>')}<br><b>Summe: <span class="num">${eur(ZW.reduce((a,c)=>a+y[yr][c],0))}</span></b>`;
    tip.hidden=false; tip.style.left=Math.min(ev.clientX+14, innerWidth-280)+'px'; tip.style.top=(ev.clientY+14)+'px'; });
  $('#chartbox svg')?.addEventListener('mouseleave', ()=> tip.hidden=true);
  setCounts();
}
function setCounts(){
  const n = E.filter(x => isCost(x) && needsReview(x)).length;
  const c = $('#cnt-ko'); if(c) c.textContent = n || '';
}

// ---------- Chronik ----------
let chrCar='alle', chrTyp='alle', chrZw='alle', chrQ='', chrLimit=150;
function renderChron(){
  chrCar = VEH;
  const q = chrQ.toLowerCase().trim();
  const match = x => (chrCar==='alle'||x.fahrzeug===chrCar) && (chrTyp==='alle'||x.typ===chrTyp) && (chrZw==='alle'||(x.typ==='ausgabe'&&zweckOf(x)===chrZw)) && (!q || (x.titel+' '+x.notiz+' '+x.bereich+' '+(x.km||'')).toLowerCase().includes(q));
  const hits = E.filter(match);
  const shown = new Set(hits.map(x=>x.id));
  const roots = E.filter(x => shown.has(x.id) && (!x.eltern_id || !shown.has(x.eltern_id))).sort((a,b)=>(b.datum||'').localeCompare(a.datum||''));
  const kids = id => E.filter(x => x.eltern_id===id && shown.has(x.id));
  let html = '', cur = '', n = 0;
  for(const r of roots){ if(n>=chrLimit) break; const m = (r.datum||'ohne Datum').slice(0,7);
    if(m!==cur){ cur=m; const lab = r.datum ? new Date(r.datum.slice(0,7)+'-15').toLocaleDateString('de-DE',{month:'long',year:'numeric'}) : 'ohne Datum';
      html += `<div class="monthhead"><span>${lab}</span></div>`; }
    html += itemHtml(r,false,false,true) + kids(r.id).map(k=>itemHtml(k,false,true,true)).join(''); n++; }
  const opt = (v,l,cur) => `<button data-v="${v}" aria-pressed="${cur===v}">${l}</button>`;
  const box = $('#chronik');
  if(!box.dataset.init){ box.dataset.init=1; box.innerHTML = `<div class="filters"><input type="search" id="q" placeholder="Suchen: Teil, Teilenummer, Händler, Notiz …" aria-label="Chronik durchsuchen">
    <div class="seg" id="fc" hidden>${opt('alle','Beide','alle')}${opt('T4','T4')}${opt('TT','TT')}</div>
    <select id="fz" aria-label="Zweck"><option value="alle">Alle Zwecke</option>${ZW.map(z=>`<option value="${z}">${ZW_SHORT[z]}</option>`).join('')}</select>
    <select id="ft" aria-label="Typ"><option value="alle">Alle Typen</option>${Object.entries(TYP).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
    <div class="small muted" id="chrinfo"></div><div class="panel" style="padding-top:4px"><div class="list" id="chrlist"></div></div>`;
    $('#q').addEventListener('input', e => { chrQ=e.target.value; chrLimit=150; renderChron(); });
    $('#fc').addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return; chrCar=b.dataset.v; [...$('#fc').children].forEach(x=>x.setAttribute('aria-pressed', x===b)); renderChron(); });
    $('#ft').addEventListener('change', e => { chrTyp=e.target.value; renderChron(); });
    $('#fz').addEventListener('change', e => { chrZw=e.target.value; renderChron(); });
  }
  $('#chrinfo').textContent = `${hits.length.toLocaleString('de-DE')} Einträge${hits.length && q ? ` · Summe Beträge: ${eur(sum(hits.filter(isCost),x=>x.betrag),2)}` : ''} · * = Datum aus der Zeile darüber übernommen`;
  $('#chrlist').innerHTML = (html || '<div class="empty">Nichts gefunden.</div>') + (roots.length>chrLimit?`<div class="empty"><button class="btn ghost" id="more">Weitere ${Math.min(150,roots.length-chrLimit)} anzeigen</button></div>`:'');
  $('#more')?.addEventListener('click', ()=>{ chrLimit+=150; renderChron(); });
}

// ---------- Lager ----------
let lagQ='', lagK='', lagU='', lagO='', lagP='', lagView='kat', lagRev=false, lagNoOrt=false;
const ortOf = x => pendingOrt[x.id] ? {o:pendingOrt[x.id].o, p:pendingOrt[x.id].p} : {o:x.lagerort||'', p:x.platz||''};
const ortOptions = (o,p,blank) => { const known = o in ORT && (!p || ORT[o].includes(p)); return `<option value="">${blank}</option>` + Object.keys(ORT).map(oo => ORT[oo].length ? `<optgroup label="${esc(oo)}"><option value="${esc(oo)}|"${(oo===o&&!p)?' selected':''}>${esc(oo)}, ohne Abteil</option>` + ORT[oo].map(pp => `<option value="${esc(oo+'|'+pp)}"${(oo===o&&pp===p)?' selected':''}>${esc(oo)} › ${esc(pp)}</option>`).join('') + '</optgroup>' : `<option value="${esc(oo)}|"${(oo===o&&!p)?' selected':''}>${esc(oo)}</option>`).join('') + ((o && !known) ? `<option value="${esc(o+'|'+p)}" selected>${esc(p?o+' › '+p:o)} (alt)</option>` : ''); };
const katOf = x => pendingKat[x.id] ? {k:pendingKat[x.id].k, u:pendingKat[x.id].u, st:'bestätigt'} : {k:x.kategorie||'', u:x.unterkategorie||'', st:x.kat_status||''};
const katOptions = (k,u,blank) => `<option value="">${blank}</option>` + Object.keys(KAT).map(kk => `<optgroup label="${esc(kk)}">` + KAT[kk].map(uu => `<option value="${esc(kk+'|'+uu)}"${(kk===k&&uu===u)?' selected':''}>${esc(uu)}</option>`).join('') + '</optgroup>').join('');
function renderStock(){
  const items = E.filter(x => inVL(x) && ((x.typ==='lager' && ['auf Lager','umtauschen'].includes(x.status)) || x.lagerort || x.auf_lager==='ja'));
  const q = lagQ.toLowerCase().trim();
  const hay = x => (x.titel+' '+x.notiz+' '+ortOf(x).o+' '+ortOf(x).p+' '+x.box+' '+x.fach+' '+katOf(x).k+' '+katOf(x).u).toLowerCase();
  const inKat = x => { const c = katOf(x); return (!lagK || c.k===lagK) && (!lagU || c.u===lagU); };
  const inOrt = x => { const c = ortOf(x); return (!lagO || (lagO===ORT_NONE ? !c.o : c.o===lagO)) && (!lagP || (lagP==='∅' ? !c.p : c.p===lagP)); };
  const isRev = x => { const c = katOf(x); return !c.k || c.st==='prüfen'; };
  const noOrt = x => !ortOf(x).o;
  const base = items.filter(x => !q || hay(x).includes(q));
  const hits = base.filter(x => inKat(x) && inOrt(x) && (!lagRev || isRev(x)) && (!lagNoOrt || noOrt(x)));
  const nRev = items.filter(isRev).length, nNoOrt = items.filter(noOrt).length;
  const box = $('#lager');
  if(!box.dataset.init){ box.dataset.init=1; box.innerHTML = `<div class="lfilters">
      <input type="search" id="lq" class="lsearch" placeholder="Wo liegt …? z. B. Ölfilter, Crimp, Sicherung" aria-label="Lager durchsuchen">
      <select id="lk" aria-label="Kategorie filtern"></select>
      <select id="lu" aria-label="Unterkategorie filtern"></select>
      <select id="lo" aria-label="Lagerort filtern"></select>
      <select id="lp" aria-label="Platz filtern"></select></div>
    <div class="lbar"><div class="seg" role="group" aria-label="Ansicht"><button type="button" data-lv="kat">Nach Kategorie</button><button type="button" data-lv="ort">Nach Ort</button></div><button type="button" class="chip" id="lno"></button><button type="button" class="chip" id="lrev"></button></div>
    <div class="small muted" id="linfo"></div><div id="lres" style="margin-top:10px"></div>`;
    $('#lq').addEventListener('input', e => { lagQ=e.target.value; renderStock(); });
    $('#lk').addEventListener('change', e => { lagK=e.target.value; lagU=''; renderStock(); });
    $('#lu').addEventListener('change', e => { lagU=e.target.value; renderStock(); });
    $('#lo').addEventListener('change', e => { lagO=e.target.value; lagP=''; renderStock(); });
    $('#lp').addEventListener('change', e => { lagP=e.target.value; renderStock(); });
    $('#lrev').addEventListener('click', () => { lagRev=!lagRev; renderStock(); });
    $('#lno').addEventListener('click', () => { lagNoOrt=!lagNoOrt; renderStock(); });
    box.querySelectorAll('[data-lv]').forEach(b => b.addEventListener('click', () => { lagView=b.dataset.lv; renderStock(); }));
    box.addEventListener('change', async e => {
      const ks = e.target.closest('[data-ksel]'), os = e.target.closest('[data-osel]'); const sel = ks || os; if(!sel || !DB) return;
      const x = byId[sel.dataset.ksel || sel.dataset.osel]; const [a,b] = sel.value ? sel.value.split('|') : ['',''];
      if(!a){ sel.value = ''; return; }
      sel.disabled = true;
      const doc = ks ? {aktion:'kategorie', ref:x.id, kategorie:a, unterkategorie:b} : {aktion:'ort', ref:x.id, lagerort:a, platz:b};
      try{ await DB.collection('eingaben').add({...doc, fahrzeug:x.fahrzeug, titel:x.titel, datum:todayIso(), erstellt:new Date().toISOString(), verarbeitet:false}); }
      catch(err){ sel.disabled = false; sel.title = 'Nicht gespeichert'; return; }
      renderStock(); }); }
  // Filter-Dropdowns mit Zählern
  const cK = {}, cU = {}, cO = {}, cP = {};
  base.forEach(x => { const c = katOf(x), o = ortOf(x); const k = c.k||KAT_NONE, oo = o.o||ORT_NONE;
    if(inOrt(x) && (!lagNoOrt || noOrt(x)) && (!lagRev || isRev(x))){ cK[k]=(cK[k]||0)+1; if(k===lagK) cU[c.u||'–']=(cU[c.u||'–']||0)+1; }
    if(inKat(x) && (!lagRev || isRev(x)) && !lagNoOrt){ cO[oo]=(cO[oo]||0)+1; if(oo===lagO) cP[o.p||'∅']=(cP[o.p||'∅']||0)+1; } });
  const nK = Object.values(cK).reduce((a,b)=>a+b,0), nO = Object.values(cO).reduce((a,b)=>a+b,0);
  $('#lk').innerHTML = `<option value="">Alle Kategorien (${nK})</option>` + [...Object.keys(KAT), KAT_NONE].filter(k => cK[k] || k===lagK).map(k => `<option value="${esc(k)}"${k===lagK?' selected':''}>${esc(k)} (${cK[k]||0})</option>`).join('');
  $('#lu').innerHTML = `<option value="">${lagK?'Alle Unterkategorien':'Unterkategorie'}</option>` + (KAT[lagK]||[]).filter(u => cU[u] || u===lagU).map(u => `<option value="${esc(u)}"${u===lagU?' selected':''}>${esc(u)} (${cU[u]||0})</option>`).join('');
  $('#lu').disabled = !lagK || !KAT[lagK];
  $('#lo').innerHTML = `<option value="">Alle Orte (${nO})</option>` + [...Object.keys(ORT), ORT_NONE].filter(o => cO[o] || o===lagO).map(o => `<option value="${esc(o)}"${o===lagO?' selected':''}>${esc(o)} (${cO[o]||0})</option>`).join('');
  $('#lp').innerHTML = `<option value="">${(ORT[lagO]||[]).length?'Alle Plätze':'Platz'}</option>` + ((ORT[lagO]||[]).length ? [...ORT[lagO], '∅'] : []).filter(p => cP[p] || p===lagP).map(p => `<option value="${esc(p)}"${p===lagP?' selected':''}>${esc(p==='∅'?'ohne Abteil':p)} (${cP[p]||0})</option>`).join('');
  $('#lp').disabled = !(ORT[lagO]||[]).length;
  box.querySelectorAll('[data-lv]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lv===lagView));
  const rb = $('#lrev'); rb.textContent = `Kategorie prüfen (${nRev})`; rb.setAttribute('aria-pressed', lagRev); rb.disabled = !nRev && !lagRev;
  const nb = $('#lno'); nb.textContent = `Ohne Ort (${nNoOrt})`; nb.setAttribute('aria-pressed', lagNoOrt); nb.disabled = !nNoOrt && !lagNoOrt;
  $('#linfo').textContent = `${hits.length} von ${items.length} Artikeln · Wert (soweit Preis bekannt): ${eur(sum(hits,x=>x.betrag),2)}`;
  // Zeilen
  const row = x => { const c = katOf(x), o = ortOf(x); const bf = [x.box,x.fach].filter(Boolean).join(' · ');
    const kcell = DB ? `<select data-ksel="${x.id}" aria-label="Kategorie für ${esc(x.titel)}">${katOptions(c.k,c.u,'Kategorie wählen …')}</select>` : `<span class="lktext">${c.k?esc(c.k+' › '+c.u):'Ohne Kategorie'}</span>`;
    const ocell = DB ? `<select data-osel="${x.id}" aria-label="Lagerort für ${esc(x.titel)}">${ortOptions(o.o,o.p,'Ort wählen …')}</select>` : `<span class="lktext">${o.o?esc(o.p?o.o+' › '+o.p:o.o):'Ohne Ort'}</span>`;
    const flag = (!c.k || c.st==='prüfen') ? `<span class="pill warn">${c.k?'Kategorie prüfen':'Kategorie fehlt'}</span>` : '';
    return `<div class="lrow"><div class="lt">${esc(x.titel)}${x.notiz?`<div class="small muted">${esc(x.notiz.split('\n')[0].slice(0,90))}</div>`:''}<div class="lm"><span class="tag ${x.fahrzeug}">${x.fahrzeug}</span>${bf?`<span>${esc(bf)}</span>`:''}${x.betrag!=null?`<span class="num">${eur(x.betrag,2)}</span>`:''}</div></div><div class="lk">${kcell}${flag}${ocell}</div></div>`; };
  let html = '';
  if(lagView==='ort'){
    const g = {}; hits.forEach(x => { const o = ortOf(x); const k = o.o||ORT_NONE; ((g[k]=g[k]||{})[o.p]=g[k][o.p]||[]).push(x); });
    const order = [...Object.keys(ORT), ...Object.keys(g).filter(k => !(k in ORT) && k!==ORT_NONE), ORT_NONE];
    html = order.filter(k => g[k]).map(k => { const pl = ORT[k]||[]; const us = Object.keys(g[k]).sort((a,b)=>{ const ia = pl.indexOf(a), ib = pl.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b); });
      const n = us.reduce((a,u)=>a+g[k][u].length,0);
      return `<div class="panel lgrp"><h3><span>${esc(k)}</span><span class="small muted">${n}</span></h3>${us.map(u => `${(u||pl.length)?`<div class="lsub"><span>${esc(u||'ohne Abteil')}</span><span>${g[k][u].length}</span></div>`:''}${g[k][u].sort((a,b)=>(a.box+a.fach).localeCompare(b.box+b.fach)||a.titel.localeCompare(b.titel)).map(row).join('')}`).join('')}</div>`; }).join('');
  } else {
    const g = {}; hits.forEach(x => { const c = katOf(x); const k = c.k||KAT_NONE; const u = c.k ? (c.u||'Sonstiges') : ''; ((g[k]=g[k]||{})[u]=g[k][u]||[]).push(x); });
    const order = [...Object.keys(KAT), ...Object.keys(g).filter(k => !KAT[k] && k!==KAT_NONE), KAT_NONE];
    html = order.filter(k => g[k]).map(k => { const us = Object.keys(g[k]).sort((a,b)=>{ const ia = (KAT[k]||[]).indexOf(a), ib = (KAT[k]||[]).indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b); });
      const n = us.reduce((a,u)=>a+g[k][u].length,0);
      return `<div class="panel lgrp"><h3><span>${esc(k)}</span><span class="small muted">${n}</span></h3>${us.map(u => `${u?`<div class="lsub"><span>${esc(u)}</span><span>${g[k][u].length}</span></div>`:''}${g[k][u].sort((a,b)=>a.titel.localeCompare(b.titel)).map(row).join('')}`).join('')}</div>`; }).join('');
  }
  $('#lres').innerHTML = html || '<div class="empty">Nichts gefunden.</div>';
}

// ---------- Lokale Datenbank (ersetzt die Claude-Datenbank) ----------
// Gleiche kleine API wie zuvor (DB.collection('eingaben').add, DB.doc('eingaben/<id>').delete),
// aber jede Eingabe wirkt sofort auf das Journal E und wird im Browser (IndexedDB) gespeichert.
const eToRec = x => {
  const r = {};
  COLS.forEach(c => {
    let v = x[c];
    if(c === 'km' || c === 'betrag' || c === 'betrag_geplant'){
      const o = x._o && x._o[c];
      v = v == null ? '' : (o != null && o !== '' && +o === v ? o : String(v));
    }
    r[c] = v == null ? '' : v;
  });
  return r;
};
const clone = x => ({...x});
const nextId = () => { let n = 0; E.forEach(x => { const m = /^A(\d+)$/.exec(x.id); if(m) n = Math.max(n, +m[1]); }); return 'A' + (n + 1); };
const addNote = (x, line) => { x.notiz = x.notiz ? x.notiz + '\n' + line : line; };
const STATUS_DEFAULT = {ausgabe:'erledigt', arbeit:'erledigt', todo:'offen', bestellung:'bestellt', lager:'auf Lager', termin:'offen'};

function newRow(d, id, docId){
  const typ = d.typ || 'arbeit';
  const num = v => (v == null || v === '' ? null : +v);
  const x = {...BLANK, id, fahrzeug: d.fahrzeug || '', datum: d.datum || todayIso(), km: num(d.km), typ,
    status: d.status || STATUS_DEFAULT[typ] || 'erledigt', bereich: d.bereich || '', titel: d.titel || 'Ohne Titel',
    betrag: num(d.betrag), kostenart: d.kostenart || '', zweck: d.zweck || 'Wartung/Reparatur',
    zweck_status: d.zweck ? 'bestätigt' : (typ === 'ausgabe' ? 'prüfen' : 'auto'), betrag_geplant: num(d.betrag_geplant),
    auf_lager: typ === 'lager' ? 'ja' : '', lagerort: d.lagerort || '', platz: d.platz || '', box: d.box || '', fach: d.fach || '',
    bestellt_am: d.bestellt_am || '', notiz: d.notiz || '', quelle: 'app:' + docId,
    kategorie: d.kategorie || '', unterkategorie: d.unterkategorie || '', kat_status: d.kategorie ? 'bestätigt' : (typ === 'lager' ? 'prüfen' : '')};
  x._o = {km: '', betrag: '', betrag_geplant: ''};
  return x;
}
function serviceRow(x){
  if(!x.km || x.status !== 'erledigt' || !['arbeit','ausgabe'].includes(x.typ) || !['T4','TT'].includes(x.fahrzeug)) return null;
  const task = Object.keys(RULES).find(t => { const r = RULES[t]; return RAW.p.some(p => p.fahrzeug === x.fahrzeug && p.aufgabe.trim() === t) && r[0].test(x.titel) && !(r[1] && r[1].test(x.titel)) && (!r[2] || r[2].test(x.titel)); });
  if(!task) return null;
  const pl = RAW.p.find(p => p.fahrzeug === x.fahrzeug && p.aufgabe.trim() === task);
  return {fahrzeug: x.fahrzeug, gruppe: pl ? pl.gruppe : 'Wartung/Wechsel', aufgabe: task, km: String(x.km), datum: x.datum, status: 'erledigt', km_geschaetzt: '', notiz: 'App ' + x.id};
}
function rollback(entry){
  if(entry.svc){ const i = RAW.s.indexOf(entry.svc); if(i >= 0){ RAW.s.splice(i, 1); Store.set('s', RAW.s); } entry.svc = null; }
  const u = entry.undo; if(!u) return;
  if(u.remove){ const i = E.findIndex(x => x.id === u.remove); if(i >= 0) E.splice(i, 1); delete byId[u.remove]; }
  else if(u.restore){ const x = byId[u.restore.id]; if(x) Object.assign(x, u.restore); }
}
async function persist(){
  const a = await Store.set('e', E.map(eToRec)), b = await Store.set('log', LOG), c = await Store.set('meta', APPMETA);
  return a && b && c;
}
async function applyEingabe(d){
  const docId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const entry = {id: docId, data: d, erstellt: d.erstellt || new Date().toISOString(), undo: null, target: ''};
  if(d.aktion === 'neu'){
    if(!d.fahrzeug || !String(d.titel || '').trim()) throw new Error('Fahrzeug und Titel fehlen.');
    const x = newRow(d, nextId(), docId); E.push(x); byId[x.id] = x; entry.undo = {remove: x.id}; entry.target = x.id;
    const sv = serviceRow(x); if(sv){ RAW.s.push(sv); entry.svc = sv; await Store.set('s', RAW.s); }
  } else {
    const x = byId[d.ref]; if(!x) throw new Error('Eintrag nicht gefunden.');
    entry.undo = {restore: clone(x)}; entry.target = x.id;
    const today = d.datum || todayIso();
    switch(d.aktion){
      case 'status':
        x.status = d.status; if(d.status === 'bestellt') x.bestellt_am = today;
        addNote(x, d.status.charAt(0).toUpperCase() + d.status.slice(1) + ' am ' + dstr(today) + ' (App).'); break;
      case 'zweck': x.zweck = d.zweck; x.zweck_status = 'bestätigt'; break;
      case 'ort': x.lagerort = d.lagerort || ''; x.platz = d.platz || ''; break;
      case 'kategorie': x.kategorie = d.kategorie || ''; x.unterkategorie = d.unterkategorie || ''; x.kat_status = 'bestätigt'; break;
      case 'geliefert':
        x.status = 'auf Lager'; x.auf_lager = 'ja'; x.lagerort = d.lagerort || x.lagerort; x.platz = d.platz || '';
        if(d.box) x.box = d.box; if(d.fach) x.fach = d.fach;
        if(d.kategorie){ x.kategorie = d.kategorie; x.unterkategorie = d.unterkategorie || ''; x.kat_status = 'bestätigt'; }
        addNote(x, 'Geliefert am ' + dstr(today) + ' (App).'); break;
      case 'aendern': {
        const f = d.felder || {};
        Object.entries(f).forEach(([k, v]) => { x[k] = (v == null && !EDIT_NUM.includes(k)) ? '' : v; });
        if('zweck' in f) x.zweck_status = 'bestätigt';
        if('datum' in f) x.datum_abgeleitet = '';
        break; }
      default: throw new Error('Unbekannte Aktion: ' + d.aktion);
    }
  }
  LOG.push(entry); if(LOG.length > 300) LOG.splice(0, LOG.length - 300);
  APPMETA.dirty = true;
  const saved = await persist();
  if(!saved && Store.ok){ rollback(entry); LOG.pop(); throw new Error('Speichern im Browser ist fehlgeschlagen.'); }
  refresh();
  return {id: entry.id};
}
async function undoEingabe(id){
  const i = LOG.findIndex(l => l.id === id); if(i < 0) return;
  rollback(LOG[i]); LOG.splice(i, 1); await persist(); refresh();
}
const DB = {
  collection(name){ return {add: d => name === 'eingaben' ? applyEingabe(d) : Promise.reject(new Error('Unbekannte Sammlung'))}; },
  doc(path){ const id = path.split('/')[1]; return {delete: () => undoEingabe(id)}; }
};
function recentList(){
  const last = new Map(); LOG.forEach((l, i) => last.set(l.target, i));
  return LOG.map((l, i) => ({id: l.id, data: l.data, undoable: last.get(l.target) === i})).slice(-25).reverse();
}
let kmAck = null;
function kmCheck(car, km, datum){
  if(km == null || !CUR[car] || !CUR[car].km) return '';
  const last = CUR[car].km, f = n => n.toLocaleString('de-DE');
  if(km > last + 3000) return `km-Stand ${f(km)} liegt weit über dem letzten Stand (${f(last)}). Tippfehler? Tippe nochmal auf Speichern, wenn er stimmt.`;
  if(km < last && (datum || '') >= iso(CUR[car].date)) return `km-Stand ${f(km)} liegt unter dem letzten Stand (${f(last)}). Tippe nochmal auf Speichern, wenn er stimmt.`;
  return '';
}

function updateNotice(){
  const el = $('#notice'); if(!el) return; const m = [];
  const go = '<a href="#" data-goto="daten">Daten</a>';
  if(!E.length) m.push(['bad', `<b>Noch keine Daten.</b> Importiere deine CSV-Dateien im Menü ${go}.`]);
  else {
    if(!Store.ok) m.push(['bad', `<b>Speicher nicht verfügbar.</b> Änderungen gehen beim Schließen verloren. Sichere sie im Menü ${go}.`]);
    const lb = APPMETA.lastBackup, days = lb ? (Date.now() - new Date(lb)) / 864e5 : null;
    if(APPMETA.dirty && (days == null || days > 14)) m.push(['warn', `<b>Backup fällig.</b> ${lb ? 'Letztes Backup vor ' + Math.floor(days) + ' Tagen.' : 'Noch kein Backup gemacht.'} Es gibt Änderungen, die nur in diesem Browser liegen. <a href="#" data-goto="daten">Jetzt sichern</a>`]);
  }
  el.innerHTML = m.map(([c, h]) => `<div class="alert ${c === 'warn' ? 'warn' : ''}"><div>${h}</div></div>`).join('');
}

let staged = null;
const nf = n => (+n).toLocaleString('de-DE');
function dl(name, text, mime){
  const b = new Blob([text], {type: mime || 'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function markBackup(){ APPMETA.lastBackup = new Date().toISOString(); APPMETA.dirty = false; await Store.set('meta', APPMETA); updateNotice(); }
const backupJson = () => JSON.stringify({format: 'zuendfunke-backup', version: 1, erstellt: new Date().toISOString(), e: E.map(eToRec), s: RAW.s, p: RAW.p, wissen: WISSEN, log: LOG, meta: APPMETA});

async function stageFiles(files){
  const s = {names: [], e: null, s: null, p: null, wissen: null, backup: null, problems: [], keepApp: true};
  for(const f of files){
    let t; try{ t = (await f.text()).replace(/^﻿/, ''); }catch(err){ s.problems.push(f.name + ': nicht lesbar'); continue; }
    const first = t.trim()[0];
    if(first === '{' || first === '['){
      try{
        const j = JSON.parse(t);
        if(j && j.format === 'zuendfunke-backup' && Array.isArray(j.e)){ s.backup = j; s.names.push(f.name + ' (Backup)'); }
        else if(j && (j.T4 || j.TT)){ s.wissen = j; s.names.push(f.name + ' (Wissen)'); }
        else s.problems.push(f.name + ': JSON nicht erkannt');
      }catch(err){ s.problems.push(f.name + ': kein gültiges JSON'); }
      continue;
    }
    const {header: h, rows} = parseCSV(t);
    if(h[0] === 'id' && h.includes('titel') && h.includes('typ')){ s.e = rows.map(r => ({...BLANK, ...r})); s.names.push(f.name + ' (Journal)'); }
    else if(h.includes('aufgabe') && h.includes('intervall_km')){ s.p = rows; s.names.push(f.name + ' (Wartungsplan)'); }
    else if(h.includes('aufgabe') && h.includes('km') && h.includes('datum')){ s.s = rows; s.names.push(f.name + ' (Service)'); }
    else s.problems.push(f.name + ': Spalten nicht erkannt');
  }
  const eRows = s.backup ? s.backup.e : s.e;
  if(eRows){
    const ids = eRows.map(r => r.id), uniq = new Set(ids);
    s.blockers = [];
    if(ids.some(i => !i)) s.blockers.push('Zeilen ohne id');
    if(uniq.size !== ids.length) s.blockers.push((ids.length - uniq.size) + ' doppelte ids');
    const bad = eRows.filter(r => !['T4', 'TT', 'WERKSTATT'].includes(r.fahrzeug)).length;
    if(bad) s.problems.push(bad + ' Zeilen mit unbekanntem Fahrzeug (werden mit übernommen)');
    const quellen = new Set(eRows.map(r => r.quelle).filter(Boolean));
    s.lost = s.backup ? [] : E.filter(x => String(x.quelle || '').startsWith('app:') && !uniq.has(x.id) && !quellen.has(x.quelle));
  }
  if(!Store.ok){ s.blockers = (s.blockers || []).concat(['Der Browser-Speicher ist nicht verfügbar']); }
  staged = s;
}
async function commitStaged(){
  const s = staged; if(!s || (s.blockers && s.blockers.length)) return;
  const norm = r => ({...BLANK, ...r});
  if(s.backup){
    const b = s.backup;
    await Store.set('e', b.e.map(norm)); await Store.set('s', b.s || []); await Store.set('p', b.p || []);
    await Store.set('wissen', b.wissen || {}); await Store.set('log', b.log || []); await Store.set('meta', b.meta || {});
  } else {
    if(s.e){
      const keep = s.keepApp ? s.lost.map(eToRec) : [];
      await Store.set('e', s.e.map(norm).concat(keep)); await Store.set('log', []);
      APPMETA.dirty = keep.length > 0; if(!keep.length) APPMETA.dirty = false;
    }
    if(s.s) await Store.set('s', s.s);
    if(s.p) await Store.set('p', s.p);
    if(s.wissen) await Store.set('wissen', s.wissen);
    APPMETA.imported = new Date().toISOString(); await Store.set('meta', APPMETA);
  }
  location.reload();
}
function stagedHtml(){
  const s = staged; if(!s) return '';
  const lines = [];
  if(s.backup) lines.push(`Backup vom ${esc(String(s.backup.erstellt || '').slice(0, 10))}: ${nf(s.backup.e.length)} Einträge. <b>Ersetzt alle Daten in der App.</b>`);
  else {
    if(s.e) lines.push(`Journal: ${nf(s.e.length)} Einträge. <b>Ersetzt</b> die ${nf(E.length)} Einträge in der App.`);
    if(s.s) lines.push(`Service-Nachweis: ${nf(s.s.length)} Zeilen (ersetzt den bisherigen).`);
    if(s.p) lines.push(`Wartungsplan: ${nf(s.p.length)} Zeilen (ersetzt den bisherigen).`);
    if(s.wissen) lines.push(`Wissen: ${Object.keys(s.wissen).join(', ')} (ersetzt das bisherige).`);
  }
  const bl = (s.blockers || []).map(b => `<div class="badline">${esc(b)}. Import nicht möglich.</div>`).join('');
  const pr = s.problems.map(p => `<div class="warnline">${esc(p)}</div>`).join('');
  const lost = s.lost && s.lost.length ? `<label class="small" style="display:flex;gap:8px;align-items:flex-start;margin-top:8px"><input type="checkbox" data-keepapp ${s.keepApp ? 'checked' : ''}> <span>${nf(s.lost.length)} in der App erfasste Einträge fehlen in dieser Datei. Diese behalten und anhängen. Sonst gehen sie verloren.</span></label>` : '';
  const ok = !(s.blockers && s.blockers.length) && (s.backup || s.e || s.s || s.p || s.wissen);
  return `<div class="note-box" style="margin-top:12px"><div><b>Gefunden:</b> ${s.names.map(esc).join(', ') || 'nichts Brauchbares'}</div>
    ${lines.map(l => `<div class="small" style="margin-top:4px">${l}</div>`).join('')}${bl}${pr}${lost}
    <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">${ok ? '<button class="btn" data-dimp-ok>Übernehmen</button>' : ''}<button class="btn ghost" data-dimp-cancel>Verwerfen</button></div></div>`;
}

const EDIT_NUM = ['km','betrag'];
function closeEdit(){ const o=$('#editov'); if(o) o.remove(); document.removeEventListener('keydown', editEsc); }
function editEsc(e){ if(e.key==='Escape') closeEdit(); }
function openEdit(id){
  const x0 = byId[id]; if(!x0) return; closeEdit();
  const x = pendingEdit[id] ? {...x0, ...pendingEdit[id]} : x0;
  const cur = {fahrzeug:x.fahrzeug||'', typ:x.typ||'', datum:x.datum||'', km:x.km, betrag:x.betrag, kostenart:x.kostenart||'', bereich:x.bereich||'', status:x.status||'', zweck:zweckOf(x), titel:x.titel||'', notiz:x.notiz||''};
  const stats = [...new Set(E.map(e=>e.status).filter(Boolean))]; if(cur.status && !stats.includes(cur.status)) stats.push(cur.status);
  const sel = (f, opts, withBlank) => `<select id="e-${f}">${withBlank?'<option value="">–</option>':''}${opts.map(([v,l])=>`<option value="${esc(v)}"${v===cur[f]?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
  const o = document.createElement('div'); o.id = 'editov';
  o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 12px 80px';
  o.innerHTML = `<form class="entry panel" id="editf" novalidate style="max-width:680px;width:100%;margin-top:3vh" role="dialog" aria-modal="true" aria-label="Eintrag bearbeiten">
    <h2 class="wide" style="margin:0">Eintrag bearbeiten</h2>
    <div class="wide small muted">${esc(x0.id)} · Änderungen gelten sofort und stehen im nächsten CSV-Export.</div>
    <label class="wide">Titel<input type="text" id="e-titel" value="${esc(cur.titel)}"></label>
    <label>Fahrzeug${sel('fahrzeug',['T4','TT','WERKSTATT'].map(v=>[v,v]))}</label>
    <label>Typ${sel('typ',Object.entries(TYP))}</label>
    <label>Datum<input type="date" id="e-datum" value="${esc(cur.datum)}"></label>
    <label>km-Stand<input type="number" id="e-km" inputmode="numeric" value="${cur.km==null?'':cur.km}"></label>
    <label>Betrag (€)<input type="number" id="e-betrag" step="0.01" inputmode="decimal" value="${cur.betrag==null?'':cur.betrag}"></label>
    <label>Kostenart${sel('kostenart',KA.map(k=>[k,k]),true)}</label>
    <label>Zweck${sel('zweck',ZW.map(z=>[z,ZW_SHORT[z]]),true)}</label>
    <label>Status${sel('status',stats.map(v=>[v,v]),true)}</label>
    <label>Bereich<input type="text" id="e-bereich" list="bereiche" value="${esc(cur.bereich)}"></label>
    <label class="wide">Notiz<textarea id="e-notiz" rows="6">${esc(cur.notiz)}</textarea></label>
    <div class="wide" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn" type="submit" id="e-save">Speichern</button><button class="btn ghost" type="button" id="e-cancel">Abbrechen</button><span class="small" id="e-msg" role="status"></span></div>
  </form>`;
  document.body.appendChild(o);
  document.addEventListener('keydown', editEsc);
  o.addEventListener('click', ev => { if(ev.target===o) closeEdit(); });
  $('#e-cancel').addEventListener('click', closeEdit);
  $('#e-titel').focus();
  $('#editf').addEventListener('submit', async ev => {
    ev.preventDefault(); const msg = $('#e-msg');
    if(!DB){ msg.textContent = 'Speicher nicht verfügbar. Bitte die Seite neu laden.'; return; }
    const felder = {}, alt = {};
    for(const f of Object.keys(cur)){
      const el = $('#e-'+f); if(!el) continue;
      let v = el.value.trim(); if(EDIT_NUM.includes(f)) v = v==='' ? null : +v;
      const was = cur[f]; if((v ?? '') !== (was ?? '')){ felder[f] = v; alt[f] = was ?? null; }
    }
    if('titel' in felder && !felder.titel){ msg.textContent = 'Der Titel darf nicht leer sein.'; return; }
    if(!Object.keys(felder).length){ msg.textContent = 'Nichts geändert.'; return; }
    const b = $('#e-save'); b.disabled = true;
    try{
      await DB.collection('eingaben').add({aktion:'aendern', ref:id, fahrzeug:x.fahrzeug, titel:x0.titel, felder, alt, datum:todayIso(), erstellt:new Date().toISOString(), verarbeitet:false});

  });
}

const dlv = {id:null, ort:'', kat:'', box:'', fach:''};
function renderBest(){

function updateBest(){
  if(!$('#be-state')) return;
  $('#be-state').textContent = '';
  $('#be-save').disabled = !DB;
  const cars = carsV();
  const eff = x => pendingStatus[x.id] || x.status;
  const zu = E.filter(x => cars.includes(x.fahrzeug) && x.typ==='bestellung' && eff(x)==='zu bestellen');
  const weg = E.filter(x => cars.includes(x.fahrzeug) && ['bestellung','todo'].includes(x.typ) && eff(x)==='bestellt');
  const da = E.filter(x => cars.includes(x.fahrzeug) && ['bestellung','todo'].includes(x.typ) && eff(x)==='geliefert');
  const neu = pending.filter(p => p.data.aktion==='neu' && p.data.typ==='bestellung' && cars.includes(p.data.fahrzeug));
  const row = (x, btns, extra) => `<div class="item"><div class="d">${x.datum ? dstr(x.datum) : ''}</div>
    <div class="t">${esc(x.titel)}<div class="meta"><span class="tag ${esc(x.fahrzeug)}">${esc(x.fahrzeug)}</span>${x.bereich ? `<span>${esc(x.bereich)}</span>` : ''}${x.betrag_geplant!=null ? `<span>geplant ${eur(x.betrag_geplant,2)}</span>` : ''}${pendingStatus[x.id] ? `<span class="pill warn">${esc(pendingStatus[x.id])} · wartet auf Abgleich</span>` : ''}</div></div>
    <div class="b">${btns}</div>${extra||''}</div>`;
  const dform = x => `<div class="dlv">
      <label>Lagerort<select data-dl="ort">${ortOptions('','','– wählen –')}</select></label>
      <label>Box<input type="text" data-dl="box" value="${esc(dlv.box)}"></label>
      <label>Fach<input type="text" data-dl="fach" value="${esc(dlv.fach)}"></label>
      <label>Kategorie<select data-dl="kat">${katOptions('','','– keine –')}</select></label>
      <div class="fr-actions" style="grid-column:1/-1"><button class="btn" data-dlsave="${esc(x.id)}">Ins Lager übernehmen</button><button class="btn ghost" data-dlcancel="1">abbrechen</button><span class="small" id="dl-msg" role="status"></span></div></div>`;
  const zuShow = beAll ? zu : zu.slice(0,12);
  let h = '';
  h += `<div class="panel"><div class="sech" style="margin-top:0"><h2 style="margin:0">Unterwegs</h2><span class="small muted">${weg.length + neu.length} Teile</span></div><div class="list">` +
    ((weg.length || neu.length) ? neu.map(p => `<div class="item"><div class="d">${p.data.datum ? dstr(p.data.datum) : ''}</div><div class="t">${esc(p.data.titel)}<div class="meta"><span class="tag ${esc(p.data.fahrzeug)}">${esc(p.data.fahrzeug)}</span><span class="pill warn">neu · wartet auf Abgleich</span></div></div><div class="b"></div></div>`).join('') +
      weg.map(x => row(x, DB ? `<button class="btn ghost" data-geliefert="${esc(x.id)}">Geliefert</button>` : '', dlv.id===x.id ? dform(x) : '')).join('')
      : '<div class="empty">Nichts unterwegs.</div>') + `</div></div>`;
  if(da.length) h += `<div class="panel" style="margin-top:16px"><div class="sech" style="margin-top:0"><h2 style="margin:0">Geliefert, wartet auf Abgleich</h2><span class="small muted">${da.length}</span></div><div class="list">${da.map(x => row(x,'')).join('')}</div></div>`;
  h += `<div class="panel" style="margin-top:16px"><div class="sech" style="margin-top:0"><h2 style="margin:0">Noch zu bestellen</h2><span class="small muted">${zu.length} Teile</span></div><div class="list">` +
    (zuShow.length ? zuShow.map(x => row(x, DB ? `<button class="btn ghost" data-bestellt="${esc(x.id)}">Bestellt</button>` : '')).join('') : '<div class="empty">Nichts offen.</div>') +
    `</div>${zu.length>12 ? `<div style="margin-top:8px"><button class="btn ghost" data-beall="1">${beAll ? 'weniger anzeigen' : 'alle ' + zu.length + ' anzeigen'}</button></div>` : ''}</div>`;
  $('#be-list').innerHTML = h;
  const s1 = document.querySelector('[data-dl="ort"]'); if(s1) s1.value = dlv.ort;
  const s2 = document.querySelector('[data-dl="kat"]'); if(s2) s2.value = dlv.kat;
}
async function saveBestellung(){
  const msg = $('#be-msg'), titel = $('#be-titel').value.trim();
  if(!titel){ msg.textContent = 'Bitte nenne das Teil.'; $('#be-titel').focus(); return; }

    await DB.collection('eingaben').add({aktion:'neu', fahrzeug:$('#be-fz').value, typ:'bestellung', status:'bestellt', datum:todayIso(), bestellt_am:todayIso(), titel, betrag:null, betrag_geplant: pr ? +pr : null, erstellt:new Date().toISOString(), verarbeitet:false});

  finally{ $('#be-save').disabled = !DB; }
}

document.getElementById('veh').addEventListener('click', e => { const b = e.target.closest('button[data-veh]'); if(b) setVeh(b.dataset.veh); });

// ---------- Tabs & Events ----------
const R = {ueberblick:renderOverview, anstehend:renderDue, kosten:renderCosts, chronik:renderChron, lager:renderStock, bestellung:renderBest, wissen:renderWissen, erfassen:renderEntry, daten:renderData};
let tab = 'ueberblick';
function show(t){ tab = t; document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===t)); Object.keys(R).forEach(k=>$('#'+k).hidden = k!==t); R[t](); try{ localStorage.setItem('gb-tab', t); }catch(e){} }
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if(b) show(b.dataset.tab); });
document.addEventListener('click', async e => {
  const cb = e.target.closest('#kosten [data-car]'); if(cb){ costCar = cb.dataset.car; renderCosts(); return; }
  const vb = e.target.closest('#kosten [data-view]'); if(vb){ costView = vb.dataset.view; renderCosts(); return; }
  const ra = e.target.closest('[data-rvall]'); if(ra){ rvAll = !rvAll; renderCosts(); return; }
  const go = e.target.closest('[data-goto]'); if(go){ e.preventDefault(); show(go.dataset.goto); window.scrollTo(0,0); return; }
  const ed = e.target.closest('[data-edit]'); if(ed){ openEdit(ed.dataset.edit); return; }
  const zok = e.target.closest('[data-zok]');
  if(zok && DB){ const x = byId[zok.dataset.zok]; const sel = document.querySelector(`[data-zsel="${x.id}"]`); zok.disabled = true;
    try{ await DB.collection('eingaben').add({aktion:'zweck', ref:x.id, zweck:sel.value, fahrzeug:x.fahrzeug, titel:x.titel, betrag:x.betrag, datum:todayIso(), erstellt:new Date().toISOString(), verarbeitet:false}); renderCosts(); }
    catch(err){ zok.disabled = false; zok.textContent = 'nicht gespeichert'; } return; }
  const done = e.target.closest('[data-done]');
  if(done && DB){ done.disabled = true; const x = byId[done.dataset.done];
    try{ await DB.collection('eingaben').add({aktion:'status', ref:x.id, status:'erledigt', fahrzeug:x.fahrzeug, datum:todayIso(), erstellt:new Date().toISOString(), verarbeitet:false}); }
    catch(err){ done.disabled = false; done.textContent = 'nicht gespeichert'; } return; }
  const undo = e.target.closest('[data-undo]');
  if(undo && DB){ undo.disabled = true; try{ await DB.doc('eingaben/' + undo.dataset.undo).delete(); }catch(err){ undo.disabled=false; } }
});
setStamp();
try{ const t = localStorage.getItem('gb-tab'); if(t && R[t]) tab = t; }catch(e){}
if(!E.length) tab = 'daten';
renderVeh(); show(tab); setCounts(); if(tab!=='anstehend') { const n = carsV().flatMap(c=>DUE[c]).filter(d=>d.st==='bad'||d.st==='warn').length + termine().length; $('#cnt-an').textContent = n || ''; }

updateNotice();
})();
</script>
<script>
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body></html>
